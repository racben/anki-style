<div class="sentence" id="sentenceMount">{{Sentence}}</div>

<div class="target" id="targetMount">{{Expression}}</div>
<div id="expression" style="display:none">{{Expression}}</div>

<div class="trad"></div>

<div class="pinyin">{{Reading}}</div>

<div class="definition">{{Definition}}</div>

<hr>

<div class="nuance">{{Notes}}</div>

{{#Source}}
<div class="notes">📝 {{Source}}</div>
{{/Source}}

<script>
(function () {
  var sentenceMount = document.getElementById('sentenceMount');
  var exprEl = document.getElementById('expression');

  if (sentenceMount && exprEl) {
    var expr = (exprEl.textContent || "").trim();
    if (expr) {
      var html = sentenceMount.innerHTML;
      var escaped = expr.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
      var re = new RegExp(escaped, 'g');
      sentenceMount.innerHTML = html.replace(re, '<b>$&</b>');
    }
  }

  if (sentenceMount) {
    var sentenceText = (sentenceMount.textContent || "").trim();
    if (sentenceText) {
      var sentenceHref =
        "https://www.mdbg.net/chinese/dictionary?page=worddict&wdrst=1&wdqchs=" +
        encodeURIComponent(sentenceText);

      sentenceMount.innerHTML =
        '<a class="sentenceLink" href="' + sentenceHref + '">' +
        sentenceMount.innerHTML +
        '</a>';
    }
  }

  var targetMount = document.getElementById('targetMount');
  if (targetMount) {
    var expr2 = (targetMount.textContent || "").trim();
    if (expr2) {
      var isMobile = /android|iphone|ipad|ipod/i.test(navigator.userAgent || "");
      var targetHref = isMobile
        ? "plecoapi://x-callback-url/s?q=" + encodeURIComponent(expr2)
        : "https://www.mdbg.net/chinese/dictionary?page=worddict&wdrst=0&wdqb=" + encodeURIComponent(expr2);

      targetMount.innerHTML =
        '<a class="targetLink" href="' + targetHref + '">' + expr2 + '</a>';
    }
  }
})();
</script>
