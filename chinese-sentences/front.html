<div class="sentence" id="sentenceMount">{{Sentence}}</div>

<div id="expression" style="display:none">{{Expression}}</div>

<script>
(function () {
  var sentenceMount = document.getElementById('sentenceMount');
  var exprEl = document.getElementById('expression');
  if (!sentenceMount || !exprEl) return;

  var expr = (exprEl.textContent || "").trim();
  if (!expr) return;

  if (!sentenceMount.querySelector('.pv')) {
    var escaped = expr.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
    sentenceMount.innerHTML = sentenceMount.innerHTML.replace(new RegExp(escaped, 'g'), '<span class="pv">$&</span>');
  }
})();
</script>
