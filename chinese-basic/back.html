<div class="prompt promptBack" id="sentenceMount">
  {{Front}}
</div>

<hr id="answer">

<div class="answer">
  {{Back}}
</div>

<script>
(function () {
  var sentenceMount = document.getElementById('sentenceMount');
  if (!sentenceMount) return;

  var sentenceText = (sentenceMount.textContent || "").trim();
  if (!sentenceText) return;

  var sentenceHref =
    "https://www.mdbg.net/chinese/dictionary?page=worddict&wdrst=1&wdqchs=" +
    encodeURIComponent(sentenceText);

  sentenceMount.innerHTML =
    '<a class="sentenceLink" href="' + sentenceHref + '">' +
    sentenceMount.innerHTML +
    '</a>';
})();
</script>
